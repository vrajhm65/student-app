<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>division</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .main{
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
        }
        .main2{
            width: 100vw;
            height: 100vh;
            top: 100vh;
            position:relative;
            display: flex;
            
        }
        .test{
            background-color: rgb(43, 12, 12);

            width:100vw;
            height:100vh;

            justify-content: center;
            align-items: center;
        }
        .test h3{
            position: absolute;
            font-weight:1rem;
            letter-spacing: 2px;
            word-spacing: 5px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            top: 5vh;
            color: rgb(160, 107, 107);

        }
        .img2{
            position: absolute;
            display: flex;
            justify-content: center;
            top: 15vh;
            margin: 0px;
            padding: 0px;
            left: 1px;
            height: 80vh;
            width: 50vw;
        }
       

        .sub1{
            background-color: brown;
            position: absolute;
            width:100vw;
            height:100vh;
        }
        .main1 img{
            background-image: url(jin\ sakai.jpg);
            background-size: cover;
            height: 100vh;
            width: 100vw;
            position: absolute;
            justify-content: center;
            align-items: center;
            display: flex;
            
        }
        .sub2{

            display: flex;

        }
        .sub2 span{
            font-size:medium ; 
        }
        .hotline{
            display: flex;

            top: 10vh;
            left: 7vw;

            font-family: sans-serif;
            font-size: small;
            letter-spacing: 2px;
            color: rgb(114, 14, 14);
        }
        
        .sub3{
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            top: 50vh;
            left: 3vw;
           height: 50vh;
           font-size: 20px;
           color: rgb(153, 19, 19);

        }
        .border2 {
             border-radius: 25px;
             margin: 0;
             padding: 5px 6px 5px 6px;
        }
        .border2:hover{
             border-bottom: 2.5px solid transparent;
             border-color: rgb(114, 14, 14);
             color:rgb(43, 12, 12);
             background-color: rgb(160, 107, 107);
        }

        .sub4{
            position: absolute;
            width: 40vw;
            height: 5vh;
            color: rgb(153, 19, 19);
            top: 4vh;
            right: 2vw;
            font-size: x-large;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
           
        } 
        .border1{
            margin: 0 10px;
            padding: 8px 6px;
            border-radius: 25px;
            font-size: 20px;
           
        }
        .border1:hover{
            border-bottom: 2.5px solid transparent;
            border-color: rgb(114, 14, 14);
            color:rgb(43, 12, 12);
            background-color: rgb(160, 107, 107);
        
        }
        .sub5{
           position: absolute;
           justify-content: center;
           align-items: center;
           display: flex;
           left: 20vw;
           bottom: 5vh;
           width:60vw;
           height: 5vh;
           font-size:0.5rem;
           background-color: rgb(160, 107, 107);
           color: rgb(43, 12, 12);
           font-family: sans-serif;
           letter-spacing: 2px;
           word-spacing: 2px;
           
        }
        .test2{
            height: 100vh;
            width: 100vw;
            position: absolute;
            justify-content: center;
            align-items: center;
            display: flex;

        
        }
        .test2 video{
            top: 13vh;
            position: absolute;
            justify-content:center;
            align-items: center;
            border-radius: 15px;
            
        }
        .test2 audio{
            position: absolute;
            justify-content: center;
        }
    </style>
</head>



<body>
    <div class="main1">
        <div class="sub1">
            <img src="jin sakai.jpg" alt="">
        </div>
        <div class="sub2">
            <h1>G H O S T  <span>O F</span>  T S U S H I M A </h1>
        </div>
        <div class="hotline">

        </div>
        
        <div class="sub3">
            <a class="border2" style="cursor:pointer;">Sign-in</a>
            <a class="border2" style="cursor:pointer;">Account</a>
            <a class="border2" style="cursor:pointer;">Mode</a>

            <a class="border1" style="cursor: pointer;"> Playstation </a>
            <a class="border1" style="cursor: pointer;">Quit game </a>

        </div>
        <div class="sub5">

                 | credits Ghost Of Tsushima.</h2>
        </div>

    </div>
    <div class="main2">
        <div class="test">
             <h3>Jin Sakai nephew of Lord Shimura</h3>
        </div>
        
        
        <div class="test2">
            <video src="jin sakai .mp4 " autoplay muted loop>
                <audio src="" autoplay loop></audio>

            </video>

        </div>
