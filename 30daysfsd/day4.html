<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>internal-css</title>
    
    <style>
       *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
       }
       body{
        background: ghostwhite;
       }
       header{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        border-bottom: 3px solid #0c0000;
        background-color: rgb(129, 32, 32);
       }
       .portfolio{
        font-size: 25px;
        font-weight: bold;
       }
       nav a{
        margin: 0 10px;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 20px;
       }  
        .border1{
            border-bottom: 1.5px solid transparent;
        }
        .border1:hover{
        border-bottom:  1.5px solid rgb(209, 87, 87);
       }
       .hero{
         display: flex;
         height: 100vh;
         background-color: rgb(209, 87, 87);
       } 
       .left{
        flex: 1;
        padding: 80px 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
       }
       .left h1{
        font-size: 36px;
        margin-bottom: 20px;
       }
       .right{
        flex: 1;
       }
       .right img{
        width: 100%;
        height: 100%;
        object-fit: cover;
       }
    </style>

</head>
<body>
     <header>
        <div class="portfolio">PROFILE</div>
        <nav>
            <a class="border1" style="cursor:pointer;" >Home</a>
            <a class="border1" style="cursor:pointer;">Contact</a>
            <a class="border1" style="cursor:pointer;">Projects</a>
            <a class="border1" style="cursor:pointer;">Github</a>
            <a class="border1" style="cursor:pointer;">Linkedin</a>
        </nav>
     </header>
   <section class="hero">
    <div class="left">
        <h1>Vinayraj hiremath</h1>
        <p class="email">vrajhm65@gmail.com</p>
    </div>
    
    <div class="right">   
     <img src="vraj2.jpeg" alt="image not found">  
    </div>
  </section>   
</body>
</html>
